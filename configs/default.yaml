language: fr
log_level: INFO

audio:
  sample_rate: 16000
  channels: 1
  block_ms: 32
  input_device: null
  output_device: null
  vad_threshold: 0.5
  min_silence_ms: 700

llm:
  host: http://localhost:11434
  model: llama3.2:3b
  temperature: 0.7
  num_ctx: 4096
  keep_alive: 30m
  timeout: 120

storage:
  db_path: data/assistant.db

stt:
  model: base
  device: cpu
  compute_type: int8
  beam_size: 1

tts:
  backend: piper
  voice: ff_siwis
  models_dir: models/tts
  kokoro_model: kokoro-v1.0.onnx
  kokoro_voices: voices-v1.0.bin
  speed: 1.0
  piper_voice: fr_FR-siwis-medium
